name: macOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/test.sh --parallel
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "CLIPSHELF_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build and package
        run: ./scripts/package.sh --arch arm64
      - name: Verify disk image
        run: |
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ClipShelf.app/Contents/Info.plist)"
          ./scripts/verify-dmg.sh "dist/ClipShelf-${APP_VERSION}-macOS-arm64.dmg"
      - name: Smoke test
        run: dist/ClipShelf.app/Contents/MacOS/ClipShelf --smoke-test
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ClipShelf-macOS-arm64
          path: |
            dist/*-macOS-arm64.dmg
            dist/*-macOS-arm64.dmg.sha256
            dist/*-macOS-arm64.zip
            dist/*-macOS-arm64.zip.sha256
          if-no-files-found: error
